# Builds the web service image (packaging/docker/Dockerfile, docs/WEB-SERVICE.md) and publishes it to GitHub's container registry:
#   ghcr.io/<owner>/lastbook:latest     the newest build of main
#   ghcr.io/<owner>/lastbook:sha-<sha>  each build of main, for pinning a deployment
#   ghcr.io/<owner>/lastbook:<version>  a tag such as v1.1.13-web.1 (without the leading v)
# Pull requests build the image without publishing it. sync-upstream.yml starts this workflow after it merges upstream.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/docker/requirements.txt
      - run: pip install -r packaging/docker/requirements.txt
      - name: Unit tests
        run: .github/scripts/unit-tests.sh

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lastbook
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Lastbook web service
            org.opencontainers.image.description=Lastbook's offline survival library served as a web service (server.py)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
